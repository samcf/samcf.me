<!doctype html>
<html lang="en">
  <head>
    <title>samcf.me</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Sam Ferrell" />
    <link rel="stylesheet" href="/normalize.css" />
    <style>
      body {
        font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, serif;
        font-size: 16px;
        margin: 24px;
      }

      main {
        max-width: 640px;
      }

      @scope (article) {
        h1 {
          font-size: 22px;
          font-weight: normal;
        }

        pre {
          overflow-x: hidden;
        }

        code {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article>$body$</article>
    </main>
  </body>
</html>
